[workspace]
resolver = "3"
members = [
    "uikit",
    "examples/*"
]
exclude = ["vendor/iced"]

[workspace.dependencies]
iced = { path = "vendor/iced", default-features = true, features = [
    "advanced",
    "canvas",
    "image",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "webgl",
    "fira-sans",
    "wgpu",
    "tiny-skia",
    "svg"
] }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Quartix <qntlink@gmail.com>"]
license = "LGPL-2.1"
repository = "https://github.com/sonata-ltd/auravibe"
rust-version = "1.91.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Optimize dependencies even in debug builds. Glyph shaping/rasterization
# (cosmic-text / swash / ttf-parser behind cryoglyph) is ~10-50x slower
# unoptimized and otherwise dominates the frame during text-heavy redraws
# (e.g. window resize). Our own crates stay unoptimized for fast incremental
# builds and debuggability.
[profile.dev.package."*"]
opt-level = 2
